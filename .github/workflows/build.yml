name: Build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build
        run: |
          ./gradlew build --no-daemon \
            -Dorg.gradle.java.installations.paths="$JAVA_HOME" \
            -Dorg.gradle.java.installations.auto-download=false

      - name: Upload server-LOD JAR
        uses: actions/upload-artifact@v4
        with:
          name: voxy-autolod-forge-1.20.1
          path: build/libs/voxy_server_lod-*.jar
          if-no-files-found: error

      - name: Upload enhanced-addon JAR
        uses: actions/upload-artifact@v4
        with:
          name: voxy-compat-addon-forge-1.20.1
          path: enhanced-addon/build/libs/voxy_compat_addon-*.jar
          if-no-files-found: warn

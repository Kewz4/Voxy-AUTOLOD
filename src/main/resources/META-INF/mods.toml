[[mods]]
    modId="voxy_server_lod"
    version="1.1.4"
    displayName="Voxy Auto LOD"
    logoFile="voxy_auto_lod_icon.png"
    description='''
Automatically generates distant terrain LODs for Voxy without requiring players to visit every chunk.

Backported for Forge 1.20.1 with Embeddium and Oculus compatibility.

Works on singleplayer and dedicated servers. On a server every connected client benefits from
pregenerated LODs — players see distant terrain the moment they join, even for areas never visited.

=== REQUIREMENTS ===
1. Forge 47.4.4 for Minecraft 1.20.1
2. Voxy (Forge 1.20.1 port) [REQUIRED on CLIENT only]
3. Embeddium [REQUIRED by Voxy on CLIENT, replaces Sodium]
4. Oculus [OPTIONAL, shader support]
5. Chunky for Forge [OPTIONAL but recommended for pregenerating chunks]
'''

[[dependencies.voxy_server_lod]]
    modId="forge"
    mandatory=true
    versionRange="[47.4.4,)"
    ordering="NONE"
    side="BOTH"

